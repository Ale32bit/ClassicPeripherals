# Important Notes:
# Every field referenced from a resource template (fabric.mod.json, neoforge.mods.toml, pack.mcmeta,
# *.mixins.json) must be present in the expandProps map in buildSrc/.../multiloader-common.gradle.

# Project
version=0.6.0
group=me.alexdevs.classicperipherals
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Classic Peripherals
mod_author=AlexDevs
mod_id=classicperipherals
license=MIT
credits=
description=Classic Peripherals is a mod that adds a bunch of peripherals to CC: Tweaked.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
fabric_version=0.116.6+1.21.1
fabric_loader_version=0.17.2

# NeoForge
neoforge_version=21.1.228
neoforge_loader_version_range=[4,)

# Mod dependencies
# CC: Tweaked - https://maven.squiddev.cc/cc/tweaked
cct_version=1.120.0
# Kaleido config - https://repo.sleeping.town
kaleido_version=0.3.3+1.3.2
# Sable companion - https://maven.ryanhcode.dev/releases
sable_companion_version=1.6.0
# BouncyCastle crypto
bouncycastle_version=1.78.1
# Trinkets (Fabric) - https://maven.terraformersmc.com
trinkets_version=3.10.0
# Curios (NeoForge) - https://maven.theillusivec4.top
curios_version=9.5.1+1.21.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
